<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор тестов</title>
    <style>
        /* Базовая тема (Style default) */
        body.default {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 680px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f9fafb;
            color: #111827;
        }

            body.default .question-card {
                background: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 8px;
                padding: 16px 20px;
                margin-bottom: 16px;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            }

            body.default .question-title {
                font-weight: 600;
                margin-bottom: 12px;
                font-size: 1.05rem;
            }

            body.default label {
                display: block;
                margin: 8px 0;
                cursor: pointer;
            }

            body.default input[type="text"] {
                width: 100%;
                box-sizing: border-box;
                padding: 8px 12px;
                border: 1px solid #d1d5db;
                border-radius: 6px;
                font-size: 1rem;
            }

            body.default button {
                background-color: #2563eb;
                color: white;
                border: none;
                padding: 10px 20px;
                font-size: 1rem;
                border-radius: 6px;
                cursor: pointer;
            }

                body.default button:hover {
                    background-color: #1d4ed8;
                }

        /* Темная тема (если указать Style dark) */
        body.dark {
            font-family: system-ui, sans-serif;
            max-width: 680px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #111827;
            color: #f3f4f6;
        }

            body.dark .question-card {
                background: #1f2937;
                border: 1px solid #374151;
                border-radius: 8px;
                padding: 16px 20px;
                margin-bottom: 16px;
            }

        /* Индикация проверки */
        .correct {
            border-left: 5px solid #16a34a !important;
        }

        .incorrect {
            border-left: 5px solid #dc2626 !important;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Контейнер для сгенерированного теста -->
    <div id="quiz-app"></div>

    <script>
            /**
             * Парсер DSL в структурированный объект теста
             */
            function parseQuizDSL(dslText) {
              const lines = dslText.split('\n').map(line => line.trim()).filter(Boolean);
              const quiz = {
                title: 'Тест',
                h1: 'Тестирование',
                style: 'default',
                questions: []
              };

              let currentQuestion = null;

              for (const line of lines) {
                // 1. Обработка метаданных
                if (line.startsWith('Title ')) {
                  quiz.title = line.slice(6).trim();
                } else if (line.startsWith('H1 ')) {
                  quiz.h1 = line.slice(3).trim();
                } else if (line.startsWith('Style ')) {
                  quiz.style = line.slice(6).trim();
                }
                // 2. Начало нового вопроса: "? Текст вопроса r|c|t"
                else if (line.startsWith('?')) {
                  const match = line.match(/^\?\s+(.+?)\s+([rct])$/);
                  if (match) {
                    currentQuestion = {
                      text: match[1].trim(),
                      type: match[2],
                      options: [],
                      answer: ''
                    };
                    quiz.questions.push(currentQuestion);
                  }
                }
                // 3. Варианты ответа для r и c: "- Вариант [+] [e]"
                else if (line.startsWith('-') && currentQuestion) {
                  let content = line.slice(1).trim();
                  let isEnd = false;
                  let isCorrect = false;

                  // Проверяем маркер конца блока вариантов 'e' (учитывая слитное "+e" и раздельное "+ e")
                  if (content.endsWith('e')) {
                    isEnd = true;
                    content = content.slice(0, -1).trim();
                  }

                  // Проверяем маркер правильного ответа '+'
                  if (content.endsWith('+')) {
                    isCorrect = true;
                    content = content.slice(0, -1).trim();
                  }

                  currentQuestion.options.push({
                    text: content,
                    correct: isCorrect
                  });

                  if (isEnd) {
                    currentQuestion = null;
                  }
                }
                // 4. Правильный ответ для текстового поля: "_ Ответ"
                else if (line.startsWith('_') && currentQuestion && currentQuestion.type === 't') {
                  currentQuestion.answer = line.slice(1).trim();
                  currentQuestion = null;
                }
              }

              return quiz;
            }

            /**
             * Генератор HTML-формы на основе разобранного объекта
             */
            function renderQuiz(dslText, containerId) {
              const quizData = parseQuizDSL(dslText);
              const container = document.getElementById(containerId);

              // Применяем метаданные
              document.title = quizData.title;
              document.body.className = quizData.style;

              container.innerHTML = '';

              const heading = document.createElement('h1');
              heading.textContent = quizData.h1;
              container.appendChild(heading);

              const form = document.createElement('form');

              quizData.questions.forEach((q, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${qIndex}`;

                const title = document.createElement('div');
                title.className = 'question-title';
                title.textContent = `${qIndex + 1}. ${q.text}`;
                card.appendChild(title);

                if (q.type === 'r' || q.type === 'c') {
                  const inputType = q.type === 'r' ? 'radio' : 'checkbox';
                  q.options.forEach((opt, optIndex) => {
                    const label = document.createElement('label');
                    const input = document.createElement('input');
                    input.type = inputType;
                    input.name = `question_${qIndex}`;
                    input.value = optIndex;

                    label.appendChild(input);
                    label.append(` ${opt.text}`);
                    card.appendChild(label);
                  });
                } else if (q.type === 't') {
                  const input = document.createElement('input');
                  input.type = 'text';
                  input.name = `question_${qIndex}`;
                  input.placeholder = 'Введите ваш ответ...';
                  card.appendChild(input);
                }

                form.appendChild(card);
              });

              const submitBtn = document.createElement('button');
              submitBtn.type = 'submit';
              submitBtn.textContent = 'Проверить ответы';
              form.appendChild(submitBtn);

              const resultBox = document.createElement('div');
              resultBox.id = 'result';
              form.appendChild(resultBox);

              // Логика проверки результатов при отправке формы
              form.addEventListener('submit', (e) => {
                e.preventDefault();
                let score = 0;

                quizData.questions.forEach((q, qIndex) => {
                  const card = document.getElementById(`q-card-${qIndex}`);
                  card.classList.remove('correct', 'incorrect');
                  let isQuestionCorrect = false;

                  if (q.type === 'r' || q.type === 'c') {
                    const inputs = form.querySelectorAll(`input[name="question_${qIndex}"]`);
                    isQuestionCorrect = Array.from(inputs).every((input, idx) => {
                      return input.checked === q.options[idx].correct;
                    });
                  } else if (q.type === 't') {
                    const input = form.querySelector(`input[name="question_${qIndex}"]`);
                    const userVal = input.value.trim().toLowerCase();
                    const correctVal = q.answer.trim().toLowerCase();
                    isQuestionCorrect = userVal === correctVal && correctVal !== '';
                  }

                  if (isQuestionCorrect) {
                    score++;
                    card.classList.add('correct');
                  } else {
                    card.classList.add('incorrect');
                  }
                });

                resultBox.textContent = `Результат: ${score} из ${quizData.questions.length}`;
              });

              container.appendChild(form);
            }

            // --- Пример запуска с кодом из вашего задания ---
            const dslSource = `
Title My title
H1 Super Test
Style default
? 2+2= r
- 4 +
- 5
- 6 e
? Second question c
- A
- B +
- C +e
? Text question t
_ My answer
            `;

            renderQuiz(dslSource, 'quiz-app');
    </script>
</body>
</html>
